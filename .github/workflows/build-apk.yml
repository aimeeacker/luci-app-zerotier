name: Build OpenWrt APK & IPK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build x86_64 Package (APK & IPK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

      - name: Download & Extract OpenWrt SDK (x86_64)
        run: |
          # Fetch the latest OpenWrt 24.10 SDK for x86_64
          SDK_URL="https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -q "$SDK_URL" -O sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk
          echo "SDK Extracted Successfully"

      - name: Copy Package to SDK
        run: |
          mkdir -p sdk/package/luci-app-zerotier-controller
          rsync -a --exclude='sdk*' --exclude='.git' ./ sdk/package/luci-app-zerotier-controller/

      - name: Update & Install Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Compile Package
        run: |
          cd sdk
          make defconfig
          make package/luci-app-zerotier-controller/compile V=s -j$(nproc)

      - name: Prepare Release Artifacts
        run: |
          mkdir -p output/
          find sdk/bin/ -name "*zerotier-controller*" -exec cp {} output/ \; 2>/dev/null || true
          
          # Create a standalone offline installer tarball
          tar -czvf output/luci-app-zerotier-controller-offline.tar.gz root/ htdocs/ README.md
          
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64-zerotier-controller-packages
          path: output/*

      - name: Create Release (Tag Triggers Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
