name: Build ImmortalWrt Controller Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_base_url:
        description: ImmortalWrt SDK target directory URL
        required: true
        default: https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/x86/64

permissions:
  contents: write

jobs:
  build:
    name: ImmortalWrt 25.12 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select SDK source
        env:
          INPUT_SDK_BASE_URL: ${{ github.event.inputs.sdk_base_url }}
        run: |
          sdk_base_url="$INPUT_SDK_BASE_URL"
          if [ -z "$sdk_base_url" ]; then
            sdk_base_url="https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/x86/64"
          fi
          echo "SDK_BASE_URL=${sdk_base_url%/}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget \
            curl zstd

      - name: Download and verify ImmortalWrt SDK
        run: |
          sdk_index="$(curl -fsSL --retry 3 "$SDK_BASE_URL/")"
          sdk_filename="$(printf '%s' "$sdk_index" | grep -oE 'immortalwrt-sdk-(25\.12-SNAPSHOT-)?x86-64[^"<]*\.tar\.zst' | sed -n '1p')"
          if [ -z "$sdk_filename" ]; then
            echo "No x86_64 ImmortalWrt SDK found at $SDK_BASE_URL" >&2
            exit 1
          fi

          curl -fL --retry 3 "$SDK_BASE_URL/$sdk_filename" -o sdk.tar.zst
          expected_sha256="$(curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" | awk -v file="$sdk_filename" '$2 == file || $2 == "*" file { print $1 }')"
          if [ -z "$expected_sha256" ]; then
            echo "SDK checksum not found for $sdk_filename" >&2
            exit 1
          fi
          echo "$expected_sha256  sdk.tar.zst" | sha256sum -c -

          tar --zstd -xf sdk.tar.zst
          sdk_dir="$(find . -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)"
          if [ -z "$sdk_dir" ]; then
            echo "Extracted SDK directory not found" >&2
            exit 1
          fi
          mv "$sdk_dir" sdk
          echo "SDK_FILENAME=$sdk_filename" >> "$GITHUB_ENV"

      - name: Install feeds and enable embedded Controller
        working-directory: sdk
        run: |
          ./scripts/feeds update packages
          ./scripts/feeds install -p packages zerotier

          zerotier_makefile="feeds/packages/net/zerotier/Makefile"
          if ! grep -q '^PKG_VERSION:=1\.16\.0$' "$zerotier_makefile" ||
             ! grep -q '^PKG_RELEASE:=2$' "$zerotier_makefile"; then
            echo "Expected the ImmortalWrt 25.12 ZeroTier 1.16.0-r2 feed package" >&2
            grep -E '^(PKG_VERSION|PKG_RELEASE):=' "$zerotier_makefile" >&2
            exit 1
          fi

          if grep -q 'ZT_NONFREE=0' "$zerotier_makefile"; then
            sed -i 's/ZT_NONFREE=0/ZT_NONFREE=1/' "$zerotier_makefile"
          elif ! grep -q 'ZT_NONFREE=' "$zerotier_makefile"; then
            sed -i '/^[[:space:]]*ZT_SSO_SUPPORTED=0 \\$/a\	ZT_NONFREE=1 \\' "$zerotier_makefile"
          fi

          if [ "$(grep -c 'ZT_NONFREE=1' "$zerotier_makefile")" -ne 1 ]; then
            echo "Failed to enable exactly one ZT_NONFREE=1 build flag" >&2
            exit 1
          fi

          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=100/' "$zerotier_makefile"
          sed -i 's/^PKG_LICENSE:=.*/PKG_LICENSE:=MPL-2.0 AND LicenseRef-ZeroTier-Source-Available-1.0/' "$zerotier_makefile"
          sed -i 's|^PKG_LICENSE_FILES:=.*|PKG_LICENSE_FILES:=LICENSE-MPL.txt nonfree/LICENSE.md|' "$zerotier_makefile"

          grep -E '^(PKG_VERSION|PKG_RELEASE|PKG_LICENSE|PKG_LICENSE_FILES)|ZT_NONFREE=' "$zerotier_makefile"

      - name: Add LuCI package to SDK
        run: |
          mkdir -p sdk/package/luci-app-zerotier-controller
          rsync -a \
            --exclude='.git' \
            --exclude='sdk' \
            --exclude='output' \
            ./ sdk/package/luci-app-zerotier-controller/

      - name: Configure packages
        working-directory: sdk
        run: |
          # The SDK generator preserves every package selected by its buildbot
          # as an unconditional default in Config-build.in. Remove only those
          # generated PACKAGE_* stanzas; keep all ABI and toolchain settings.
          embedded_package_defaults="$(awk '/^config PACKAGE_/ { count++ } END { print count + 0 }' Config-build.in)"
          echo "Removing $embedded_package_defaults embedded SDK package defaults"
          sed -i '/^config PACKAGE_/,/^$/d' Config-build.in
          if grep -q '^config PACKAGE_' Config-build.in; then
            echo "Failed to remove embedded SDK package defaults" >&2
            exit 1
          fi

          # Select only the requested packages. defconfig adds their mandatory
          # build and runtime dependencies.
          printf '%s\n' \
            '# CONFIG_ALL is not set' \
            '# CONFIG_ALL_KMODS is not set' \
            '# CONFIG_ALL_NONSHARED is not set' \
            '# CONFIG_AUTOREMOVE is not set' \
            'CONFIG_PACKAGE_zerotier=m' \
            'CONFIG_PACKAGE_luci-app-zerotier-controller=m' > .config
          make defconfig
          echo "Bulk selectors:"
          grep -E '^(# )?CONFIG_ALL(_(KMODS|NONSHARED))?' .config

          if grep -qE '^CONFIG_ALL(_(KMODS|NONSHARED))?=[ym]$' .config; then
            echo "SDK broad package selectors are still enabled" >&2
            exit 1
          fi

          if grep -q '^CONFIG_AUTOREMOVE=y$' .config; then
            echo "SDK build directory cleanup is still enabled" >&2
            exit 1
          fi

          for package in zerotier luci-app-zerotier-controller; do
            if ! grep -q "^CONFIG_PACKAGE_${package}=m$" .config; then
              echo "Expected CONFIG_PACKAGE_${package}=m" >&2
              exit 1
            fi
          done

          selected_packages="$(awk '/^CONFIG_PACKAGE_.*=[ym]$/ { count++ } END { print count + 0 }' .config)"
          echo "Selected packages ($selected_packages):"
          if [ "$selected_packages" -gt 128 ]; then
            grep -E '^CONFIG_PACKAGE_.*=[ym]$' .config | sed -n '1,128p'
            echo "Refusing broad build: $selected_packages packages are selected" >&2
            exit 1
          fi
          grep -E '^CONFIG_PACKAGE_.*=[ym]$' .config

          selected_kmods="$(awk '/^CONFIG_PACKAGE_kmod-.*=[ym]$/ { count++ } END { print count + 0 }' .config)"
          echo "Selected kernel modules ($selected_kmods):"
          if [ "$selected_kmods" -gt 64 ]; then
            grep -E '^CONFIG_PACKAGE_kmod-.*=[ym]$' .config | sed -n '1,64p'
            echo "Refusing broad build: $selected_kmods kernel modules are selected" >&2
            exit 1
          fi
          grep -E '^CONFIG_PACKAGE_kmod-.*=[ym]$' .config || true

      - name: Build Controller-enabled ZeroTier
        working-directory: sdk
        run: |
          make package/feeds/packages/zerotier/clean
          make package/feeds/packages/zerotier/compile V=s -j"$(nproc)"

      - name: Build LuCI controller package
        working-directory: sdk
        run: |
          make package/luci-app-zerotier-controller/clean
          make package/luci-app-zerotier-controller/compile V=s -j"$(nproc)"

      - name: Collect and verify artifacts
        run: |
          mkdir -p output
          artifact_count=0
          while IFS= read -r -d '' package_file; do
            cp "$package_file" output/
            artifact_count=$((artifact_count + 1))
          done < <(find sdk/bin/packages -type f \( \
            -name 'zerotier-[0-9]*.apk' -o \
            -name 'zerotier_*.ipk' -o \
            -name 'luci-app-zerotier-controller-*.apk' -o \
            -name 'luci-app-zerotier-controller_*.ipk' \
          \) -print0)

          if [ "$artifact_count" -lt 2 ]; then
            echo "Expected both ZeroTier and LuCI packages, found $artifact_count" >&2
            find sdk/bin -type f \( -name '*.apk' -o -name '*.ipk' \) -print
            exit 1
          fi

          controller_license="$(find sdk/build_dir -type f -path '*/ZeroTierOne-*/nonfree/LICENSE.md' -print -quit)"
          if [ -z "$controller_license" ]; then
            echo "ZeroTier Controller license file not found" >&2
            exit 1
          fi
          cp "$controller_license" output/ZEROTIER-CONTROLLER-LICENSE.md

          printf '%s\n' \
            "SDK: $SDK_FILENAME" \
            "SDK source: $SDK_BASE_URL" \
            "Target: ImmortalWrt 25.12 x86/64" \
            "ZeroTier Controller: ZT_NONFREE=1" \
            "ZeroTier package release override: r100" > output/BUILD-INFO.txt

          sha256sum output/* > output/SHA256SUMS
          ls -lh output

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-x86_64-zerotier-controller
          path: output/*
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
