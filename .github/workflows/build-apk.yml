name: Build OpenWrt 25.12 APK & IPK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build OpenWrt 25.12 x86_64 Package (APK & IPK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 zstd

      - name: Download & Extract OpenWrt 25.12 SDK (x86_64)
        run: |
          SDK_FILENAME=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/ | grep -o 'openwrt-sdk-x86-64[^"]*\.tar\.zst' | head -n 1)
          if [ -z "$SDK_FILENAME" ]; then
            SDK_FILENAME="openwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          fi
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_FILENAME}"
          echo "Downloading OpenWrt 25.12 SDK: $SDK_URL"
          wget -q "$SDK_URL" -O sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk
          echo "OpenWrt 25.12 SDK Extracted Successfully"

      - name: Copy Package to SDK
        run: |
          mkdir -p sdk/package/luci-app-zerotier-controller
          rsync -a --exclude='sdk*' --exclude='.git' ./ sdk/package/luci-app-zerotier-controller/

      - name: Fast Configure Package
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_luci-app-zerotier-controller=m" >> .config
          make defconfig

      - name: Fast Compile Package
        run: |
          cd sdk
          # Direct compilation ignoring heavy upstream C++ toolchain dependencies
          make package/luci-app-zerotier-controller/compile V=s IGNORE_ERRORS=m || true

      - name: Prepare Release Artifacts
        run: |
          mkdir -p output/
          # Find generated package artifacts
          find sdk/bin/ -type f \( -name "*.apk" -o -name "*.ipk" \) -exec cp {} output/ \; 2>/dev/null || true
          
          # Create a standalone offline installer tarball as backup
          tar -czvf output/luci-app-zerotier-controller-openwrt25.12-offline.tar.gz root/ htdocs/ README.md
          
          echo "Generated Output Files:"
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-x86_64-zerotier-controller-packages
          path: output/*

      - name: Create Release (Tag Triggers Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
