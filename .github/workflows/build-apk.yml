name: Build ImmortalWrt LuCI Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_base_url:
        description: ImmortalWrt SDK target directory URL
        required: true
        default: https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/x86/64

permissions:
  contents: write

jobs:
  build:
    name: ImmortalWrt 25.12 x86_64 LuCI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select SDK source
        env:
          INPUT_SDK_BASE_URL: ${{ github.event.inputs.sdk_base_url }}
        run: |
          sdk_base_url="$INPUT_SDK_BASE_URL"
          if [ -z "$sdk_base_url" ]; then
            sdk_base_url="https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/x86/64"
          fi
          echo "SDK_BASE_URL=${sdk_base_url%/}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget \
            curl jq zstd

      - name: Validate LuCI and rpcd source
        run: |
          sh -n root/usr/libexec/rpcd/zerotier-controller
          sh -n tests/test-rpcd-ip-pool.sh
          sh -n tests/fixtures/mock-curl
          sh -n tests/fixtures/mock-ucode
          node --check htdocs/luci-static/resources/view/zerotier/controller.js
          node --check htdocs/luci-static/resources/zerotier/qrcode.js
          node -e 'const fs=require("fs"); const source=fs.readFileSync("htdocs/luci-static/resources/zerotier/qrcode.js","utf8"); const mockL={Class:{extend: function(obj){ return obj; }}}; const mod=new Function("L", "Class", source)(mockL, mockL.Class); const qr=mod.create(0,"M"); qr.addData("4ab50a5631fd3edd"); qr.make(); const svg=qr.createSvgTag(4,3); if (!svg.includes("<svg") || qr.getModuleCount()<21) throw new Error("QR generator validation failed");'
          node -e 'const fs=require("fs"); const src=fs.readFileSync("root/usr/libexec/rpcd/zerotier-controller.ucode","utf8"); if (src.includes("from '\''os'\''") || src.includes("function lc(") || /\b(?:rand|strftime)\s*\(/.test(src) || /ARGV\[2\]/.test(src) || /\+\s*\{/.test(src)) throw new Error("Unsupported ucode pattern found");'
          jq -e . root/usr/share/rpcd/acl.d/luci-app-zerotier.json >/dev/null
          msgfmt --check --check-format -o /dev/null po/zh_Hans/zerotier.po
          tests/test-rpcd-ip-pool.sh

      - name: Download and verify ImmortalWrt SDK
        run: |
          sdk_index="$(curl -fsSL --retry 3 "$SDK_BASE_URL/")"
          sdk_filename="$(printf '%s' "$sdk_index" | grep -oE 'immortalwrt-sdk-(25\.12-SNAPSHOT-)?x86-64[^"<]*\.tar\.zst' | sed -n '1p')"
          if [ -z "$sdk_filename" ]; then
            echo "No x86_64 ImmortalWrt SDK found at $SDK_BASE_URL" >&2
            exit 1
          fi

          curl -fL --retry 3 "$SDK_BASE_URL/$sdk_filename" -o sdk.tar.zst
          expected_sha256="$(curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" | awk -v file="$sdk_filename" '$2 == file || $2 == "*" file { print $1 }')"
          if [ -z "$expected_sha256" ]; then
            echo "SDK checksum not found for $sdk_filename" >&2
            exit 1
          fi
          echo "$expected_sha256  sdk.tar.zst" | sha256sum -c -

          tar --zstd -xf sdk.tar.zst
          sdk_dir="$(find . -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)"
          if [ -z "$sdk_dir" ]; then
            echo "Extracted SDK directory not found" >&2
            exit 1
          fi
          mv "$sdk_dir" sdk
          echo "SDK_FILENAME=$sdk_filename" >> "$GITHUB_ENV"

      - name: Install LuCI build feeds
        working-directory: sdk
        run: |
          # Install package metadata for runtime dependency resolution and only
          # the LuCI host tools required to build the application packages.
          # The ZeroTier daemon and embedded Controller binary are not compiled.
          ./scripts/feeds update base packages luci
          ./scripts/feeds install -p base lua
          ./scripts/feeds install -p packages zerotier luasrcdiet
          ./scripts/feeds install -p luci luci-base csstidy

      - name: Add LuCI package to SDK
        run: |
          if [ -L sdk/package/feeds/luci/luci-app-zerotier ]; then
            rm sdk/package/feeds/luci/luci-app-zerotier
          fi

          mkdir -p sdk/package/luci-app-zerotier
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='sdk' \
            --exclude='output' \
            ./ sdk/package/luci-app-zerotier/

      - name: Configure LuCI packages
        working-directory: sdk
        run: |
          embedded_package_defaults="$(awk '/^config PACKAGE_/ { count++ } END { print count + 0 }' Config-build.in)"
          echo "Removing $embedded_package_defaults embedded SDK package defaults"
          sed -i '/^config PACKAGE_/,/^$/d' Config-build.in
          if grep -q '^config PACKAGE_' Config-build.in; then
            echo "Failed to remove embedded SDK package defaults" >&2
            exit 1
          fi

          printf '%s\n' \
            '# CONFIG_ALL is not set' \
            '# CONFIG_ALL_KMODS is not set' \
            '# CONFIG_ALL_NONSHARED is not set' \
            '# CONFIG_AUTOREMOVE is not set' \
            'CONFIG_PACKAGE_luci-app-zerotier=m' \
            'CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=m' > .config
          make defconfig

          if grep -qE '^CONFIG_ALL(_(KMODS|NONSHARED))?=[ym]$' .config; then
            echo "SDK broad package selectors are still enabled" >&2
            exit 1
          fi
          if grep -q '^CONFIG_AUTOREMOVE=y$' .config; then
            echo "SDK build directory cleanup is still enabled" >&2
            exit 1
          fi

          for package in luci-app-zerotier luci-i18n-zerotier-zh-cn; do
            if ! grep -q "^CONFIG_PACKAGE_${package}=m$" .config; then
              echo "Expected CONFIG_PACKAGE_${package}=m" >&2
              exit 1
            fi
          done

          selected_packages="$(awk '/^CONFIG_PACKAGE_.*=[ym]$/ { count++ } END { print count + 0 }' .config)"
          echo "Selected packages ($selected_packages):"
          if [ "$selected_packages" -gt 128 ]; then
            grep -E '^CONFIG_PACKAGE_.*=[ym]$' .config | sed -n '1,128p'
            echo "Refusing broad build: $selected_packages packages are selected" >&2
            exit 1
          fi
          grep -E '^CONFIG_PACKAGE_.*=[ym]$' .config

      - name: Build LuCI application and Simplified Chinese translation
        working-directory: sdk
        run: |
          make package/feeds/luci/luci-base/host/compile V=s -j"$(nproc)"
          for tool in jsmin po2lmo; do
            if ! find staging_dir -type f -path "*/bin/$tool" -perm -111 -print -quit | grep -q .; then
              echo "Required LuCI host tool not found: $tool" >&2
              exit 1
            fi
          done

          make package/luci-app-zerotier/clean
          make package/luci-app-zerotier/compile V=s -j"$(nproc)"

      - name: Collect and verify artifacts
        run: |
          mkdir -p output

          collect_one() {
            pattern="$1"
            label="$2"
            mapfile -d '' matches < <(find sdk/bin/packages -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one $label APK, found ${#matches[@]}" >&2
              find sdk/bin/packages -type f -name '*.apk' -print >&2
              exit 1
            fi
            cp "${matches[0]}" output/
          }

          collect_one 'luci-app-zerotier-[0-9]*.apk' 'LuCI application'
          collect_one 'luci-i18n-zerotier-zh-cn-[0-9]*.apk' 'Simplified Chinese translation'

          if find output -maxdepth 1 -type f -name 'zerotier-[0-9]*.apk' | grep -q .; then
            echo "ZeroTier daemon package must not be part of this LuCI-only build" >&2
            exit 1
          fi

          printf '%s\n' \
            "SDK: $SDK_FILENAME" \
            "SDK source: $SDK_BASE_URL" \
            "Target: ImmortalWrt 25.12 x86/64" \
            "Build scope: LuCI application and Simplified Chinese translation only" \
            "ZeroTier daemon/Controller binary: not rebuilt" \
            "Packages: luci-app-zerotier, luci-i18n-zerotier-zh-cn" > output/BUILD-INFO.txt

          (
            cd output
            sha256sum BUILD-INFO.txt *.apk > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -lh output

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-x86_64-luci-zerotier
          path: output/*
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
